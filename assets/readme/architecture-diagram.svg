<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="eng-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <linearGradient id="qa-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="des-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-arch { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #f8fafc; }
    .box-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 16px; fill: #ffffff; }
    .box-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 13px; fill: #e2e8f0; }
    .node-text { font-family: 'JetBrains Mono', monospace, system-ui, sans-serif; font-weight: 600; font-size: 12px; fill: #94a3b8; }
    .arrow { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
  </style>

  <!-- Canvas -->
  <rect width="1200" height="520" rx="16" fill="url(#bg-grad-2)"/>

  <!-- Border -->
  <rect x="2" y="2" width="1196" height="516" rx="14" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Level: Host Platform -->
  <g transform="translate(250, 30)">
    <rect width="700" height="56" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-soft)"/>
    <text x="350" y="35" text-anchor="middle" class="box-title">🚀 Google Antigravity / AGY 2.0 / Gemini CLI</text>
  </g>

  <!-- Down Arrow 1 -->
  <path d="M600 86 V125" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Core Level: Superpowers Protocols -->
  <g transform="translate(180, 125)">
    <rect width="840" height="70" rx="12" fill="#0f172a" stroke="url(#core-grad)" stroke-width="2" filter="url(#glow-soft)"/>
    <text x="420" y="32" text-anchor="middle" class="box-title" fill="url(#core-grad)">⚡ Antigravity Superpowers Core (13 Binding Execution Protocols)</text>
    <text x="420" y="54" text-anchor="middle" class="node-text">Auto-Inject • Parallel Simulation • Codebase Telepathy • Self-Healing • Bun Engine • Security Shield</text>
  </g>

  <!-- Connectors from Core to 4 Divisions -->
  <path d="M600 195 V240" stroke="#818cf8" stroke-width="2"/>
  <path d="M210 240 H990" stroke="#818cf8" stroke-width="2"/>
  <path d="M210 240 V270" stroke="#38bdf8" stroke-width="2"/>
  <path d="M470 240 V270" stroke="#c084fc" stroke-width="2"/>
  <path d="M730 240 V270" stroke="#34d399" stroke-width="2"/>
  <path d="M990 240 V270" stroke="#fbbf24" stroke-width="2"/>

  <!-- 4 Specialized Division Boxes -->
  <!-- 1. Engineering Division -->
  <g transform="translate(80, 270)">
    <rect width="260" height="130" rx="12" fill="url(#eng-grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="130" y="32" text-anchor="middle" class="box-title">💻 Engineering</text>
    <text x="130" y="52" text-anchor="middle" class="box-sub">57 Specialized Skills</text>
    <path d="M20 68 H240" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="130" y="88" text-anchor="middle" class="node-text" fill="#f1f5f9">Architect, AI/ML, DevOps,</text>
    <text x="130" y="106" text-anchor="middle" class="node-text" fill="#f1f5f9">DB, Systems, Mobile, Web</text>
  </g>

  <!-- 2. Security Division -->
  <g transform="translate(370, 270)">
    <rect width="260" height="130" rx="12" fill="url(#sec-grad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="130" y="32" text-anchor="middle" class="box-title">🛡️ Security</text>
    <text x="130" y="52" text-anchor="middle" class="box-sub">12 Specialized Skills</text>
    <path d="M20 68 H240" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="130" y="88" text-anchor="middle" class="node-text" fill="#f1f5f9">AppSec, OWASP, Pentest,</text>
    <text x="130" y="106" text-anchor="middle" class="node-text" fill="#f1f5f9">Compliance, Secrets Guard</text>
  </g>

  <!-- 3. Testing & QA Division -->
  <g transform="translate(660, 270)">
    <rect width="260" height="130" rx="12" fill="url(#qa-grad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="130" y="32" text-anchor="middle" class="box-title">🧪 Testing &amp; QA</text>
    <text x="130" y="52" text-anchor="middle" class="box-sub">9 Specialized Skills</text>
    <path d="M20 68 H240" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="130" y="88" text-anchor="middle" class="node-text" fill="#f1f5f9">E2E Playwright, API Tester,</text>
    <text x="130" y="106" text-anchor="middle" class="node-text" fill="#f1f5f9">Performance, A11y, Evidence</text>
  </g>

  <!-- 4. Design Division -->
  <g transform="translate(950, 270)">
    <rect width="170" height="130" rx="12" fill="url(#des-grad)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="85" y="32" text-anchor="middle" class="box-title">🎨 Design</text>
    <text x="85" y="52" text-anchor="middle" class="box-sub">10 Skills</text>
    <path d="M15 68 H155" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="85" y="88" text-anchor="middle" class="node-text" fill="#f1f5f9">UI/UX, Polish,</text>
    <text x="85" y="106" text-anchor="middle" class="node-text" fill="#f1f5f9">Design Tokens</text>
  </g>

  <!-- Bottom Output Layer -->
  <g transform="translate(80, 435)">
    <rect width="1040" height="50" rx="10" fill="#020617" stroke="#334155" stroke-width="1"/>
    <text x="520" y="30" text-anchor="middle" class="node-text" fill="#38bdf8">🔒 Zero-Prompt Auto-Injection &amp; Pre-Push Privacy Path Dynamizer Shield Enforced Across All Runs</text>
  </g>
</svg>
