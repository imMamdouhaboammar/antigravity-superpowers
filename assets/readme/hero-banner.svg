<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#05070e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="emerald-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: url(#cyan-purple); }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'JetBrains Mono', monospace, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .metric-num { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 28px; fill: #f8fafc; }
    .metric-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #64748b; text-transform: uppercase; letter-spacing: 1px; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#glow)"/>

  <!-- Tech Grid Background Overlay -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200"/>
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420 M800 0 V420 M900 0 V420 M1000 0 V420 M1100 0 V420"/>
  </g>

  <!-- Glowing Accent Curves -->
  <path d="M-50 100 Q 300 -50 600 150 T 1250 200" fill="none" stroke="url(#cyan-purple)" stroke-width="3" opacity="0.4" filter="url(#neon-glow)"/>
  <path d="M-50 350 Q 400 450 800 280 T 1250 100" fill="none" stroke="url(#emerald-teal)" stroke-width="2" opacity="0.3"/>

  <!-- Main Hero Icon / Emblem -->
  <g transform="translate(80, 70)">
    <circle cx="50" cy="50" r="50" fill="url(#cyan-purple)" opacity="0.15" filter="url(#neon-glow)"/>
    <circle cx="50" cy="50" r="42" fill="#0f172a" stroke="url(#cyan-purple)" stroke-width="2.5"/>
    <path d="M50 22 L72 70 L50 58 L28 70 Z" fill="url(#cyan-purple)"/>
    <circle cx="50" cy="42" r="6" fill="#ffffff"/>
  </g>

  <!-- Title & Headline -->
  <text x="200" y="110" class="title">⚡ Antigravity Superpowers</text>
  <text x="200" y="148" class="subtitle">Autonomous Super-Engineering Protocols &amp; 88+ Specialized Division Skills</text>

  <!-- Key Capability Tags -->
  <g transform="translate(200, 175)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
    <text x="28" y="21" class="badge-text" fill="#38bdf8">Zero-Prompt Auto-Inject</text>

    <!-- Tag 2 -->
    <rect x="192" y="0" width="180" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="208" cy="16" r="5" fill="#818cf8"/>
    <text x="220" y="21" class="badge-text" fill="#818cf8">Parallel Simulations</text>

    <!-- Tag 3 -->
    <rect x="384" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <circle cx="400" cy="16" r="5" fill="#34d399"/>
    <text x="412" y="21" class="badge-text" fill="#34d399">Privacy Pre-Push Shield</text>

    <!-- Tag 4 -->
    <rect x="566" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
    <circle cx="582" cy="16" r="5" fill="#fbbf24"/>
    <text x="594" y="21" class="badge-text" fill="#fbbf24">Bun Engine Native</text>
  </g>

  <!-- Division Dashboard Cards -->
  <g transform="translate(80, 240)">
    <!-- Card 1: Engineering -->
    <rect x="0" y="0" width="245" height="120" rx="12" fill="url(#card-bg)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="38" class="metric-num" fill="#38bdf8">57 Skills</text>
    <text x="20" y="62" class="metric-label">Engineering Division</text>
    <text x="20" y="90" font-family="sans-serif" font-size="12" fill="#94a3b8">Architecture, AI/ML, DevOps, DB</text>

    <!-- Card 2: Security -->
    <rect x="265" y="0" width="245" height="120" rx="12" fill="url(#card-bg)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="285" y="38" class="metric-num" fill="#c084fc">12 Skills</text>
    <text x="285" y="62" class="metric-label">Security Division</text>
    <text x="285" y="90" font-family="sans-serif" font-size="12" fill="#94a3b8">AppSec, Cloud, OWASP, Audit</text>

    <!-- Card 3: Testing & QA -->
    <rect x="530" y="0" width="245" height="120" rx="12" fill="url(#card-bg)" stroke="#34d399" stroke-width="1.5"/>
    <text x="550" y="38" class="metric-num" fill="#34d399">9 Skills</text>
    <text x="550" y="62" class="metric-label">Testing &amp; QA Division</text>
    <text x="550" y="90" font-family="sans-serif" font-size="12" fill="#94a3b8">Playwright, API, E2E, Benchmarks</text>

    <!-- Card 4: Design & UX -->
    <rect x="795" y="0" width="245" height="120" rx="12" fill="url(#card-bg)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="815" y="38" class="metric-num" fill="#fbbf24">10 Skills</text>
    <text x="815" y="62" class="metric-label">Design &amp; UX Division</text>
    <text x="815" y="90" font-family="sans-serif" font-size="12" fill="#94a3b8">UI/UX, WCAG, Polish, Branding</text>
  </g>
</svg>
