name: CI

on:
  push:
    branches:
      - master
      - "daily/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Check Skills.sh manifest
        run: bun run check:manifest

      - name: Check skill mirror
        run: bun run check:skill-mirror

      - name: Check privacy paths
        run: bun run bin/cli.ts check-privacy

      - name: Smoke test routing CLI
        run: bun run bin/cli.ts route "Debug failing test"
